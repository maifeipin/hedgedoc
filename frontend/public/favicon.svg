<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favTechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="favGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon
    points="50,5 92,28 92,72 50,95 8,72 8,28"
    fill="#0f172a"
    stroke="url(#favTechGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
  />
  <polygon
    points="50,14 83,32 83,68 50,86 17,68 17,32"
    fill="none"
    stroke="url(#favTechGrad)"
    stroke-width="1.2"
    stroke-opacity="0.5"
    stroke-dasharray="4 2"
  />

  <!-- Monogram 'H' -->
  <path
    d="M30 33 V67 M30 50 H46 M46 33 V67"
    stroke="url(#favGlowGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />

  <!-- Monogram 'D' -->
  <path
    d="M54 33 H63 C72 33, 77 41, 77 50 C77 59, 72 67, 63 67 H54 V33 Z"
    stroke="url(#favGlowGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#favGlow)"
  />

  <!-- Laser Accent Dot -->
  <circle cx="71" cy="27" r="3.5" fill="#38bdf8" />
</svg>
